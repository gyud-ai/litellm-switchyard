name: Live gateway tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    environment: live
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --group dev
      - run: uv run --frozen pytest -m live
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          GATEWAY_API_KEY: ${{ secrets.GATEWAY_API_KEY }}
          LIVE_PAIR: ${{ vars.LIVE_PAIR }}
          LIVE_EFFICIENT_MODEL: ${{ vars.LIVE_EFFICIENT_MODEL }}
          LIVE_CAPABLE_MODEL: ${{ vars.LIVE_CAPABLE_MODEL }}
