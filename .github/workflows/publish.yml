# Build both images and push them to GHCR. compose.yaml pulls these tags by
# default, so fresh machines deploy with plain `docker compose up -d`
# (no local Rust build). Rebuild locally with `docker compose up -d --build`
# only when Dockerfiles or build args (SWITCHYARD_REF) change.
name: Publish images to GHCR

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - Dockerfile.headroom
      - compose.yaml
      - profiles/**
      - plugins/**
      - .github/workflows/publish.yml

permissions:
  contents: read
  packages: write
  # type=gha build cache reads/writes through the Actions cache service.
  actions: write

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile
            image: ghcr.io/gyud-ai/litellm-switchyard-proxy
            version-tag: "1.97.0"
          - dockerfile: Dockerfile.headroom
            image: ghcr.io/gyud-ai/litellm-switchyard-headroom
            version-tag: "0.27.0"
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ matrix.version-tag }}
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}
