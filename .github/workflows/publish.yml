name: Publish gateway image
on:
  push:
    branches: [main]
    paths: [Dockerfile, pyproject.toml, uv.lock, src/**, .github/workflows/publish.yml]
permissions:
  contents: read
  packages: write
  actions: write
concurrency:
  group: publish-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Read project version
        id: version
        run: |
          VERSION=$(uv run --no-project --python 3.14 python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/gyud-ai/switchyard-gateway:${{ steps.version.outputs.value }}
            ghcr.io/gyud-ai/switchyard-gateway:sha-${{ github.sha }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
