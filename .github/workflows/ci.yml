name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --group dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src
      - run: uv run --frozen pytest -m 'not live'
      - run: uv lock --check
      - run: uv run --frozen python scripts/smoke.py
      - name: Validate Compose
        run: |
          cp .env.example .env
          cp config.example.jsonc config.jsonc
          docker compose config --quiet
      - name: Build and smoke-test image
        run: |
          docker build -t gateway-ci .
          docker run --rm --entrypoint /app/.venv/bin/python \
            -v "$PWD/scripts/smoke.py:/tmp/smoke.py:ro" gateway-ci /tmp/smoke.py
          uv run --frozen python scripts/container_smoke.py --image gateway-ci
      - name: Refuse tracked private configuration
        run: |
          test -z "$(git ls-files -- .env config.jsonc)"
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
