# LiteLLM proxy + Switchyard stage routing: TWO-ENDPOINT CHEAP TIER example.
#
# Same as litellm.yaml (DEFAULT single-pair inventory) plus ONE extra routed
# deployment for the cheap tier (3 deployments, 2 UNIQUE models under
# `os.environ/SWITCHYARD_GROUP`). NOT loaded by default (compose.yaml mounts
# this dir but starts with `--config /app/deployment/${LITELLM_CONFIG_FILE:-litellm.yaml}`).
# To try it:
#
#   cp profiles/stage/litellm.multiple.yaml profiles/stage/litellm.yaml
#   docker compose up -d --wait
#
# (or back up litellm.yaml first). Restore afterwards with git checkout.
# Distinct from litellm.multipair.yaml (a SECOND pair under SWITCHYARD_GROUP_2
# via .env.multipair): this file keeps ONE pair and puts two endpoints behind
# its cheap tier instead.
#
# Deliberately minimal diff vs litellm.yaml: the added deployment reuses every
# CHEAP_* variable — only its api_base is hardcoded to the second server
# (172.17.12.4:8080). Nothing else changed; both direct groups stay
# single-deployment. All IDs, keys, and other bases stay .env-owned, e.g.:
#
#   CHEAP_MODEL_ID=unsloth/Qwen3.8-27B-GGUF
#   CHEAP_API_BASE=http://172.17.12.3:8080/v1   (cheap endpoint A)
#   CHEAP_API_KEY=sk-local-any                  (local servers accept any key)
#   EXPENSIVE_API_BASE=https://openrouter.ai/api/v1
#   EXPENSIVE_MODEL_ID=deepseek/deepseek-v4.1-flash
#   EXPENSIVE_API_KEY=<openrouter key>
#
# Why this works (both layers dedupe by `litellm_params.model`):
#
# - LiteLLM builds `candidate_models` from `litellm_params.model` per
#   deployment (router.py `_run_routing_plugins`), so the switchyard group's
#   three deployments below present as ["<expensive>", "<cheap>", "<cheap>"].
# - plugins/stage_scoped.py dedupes (`dict.fromkeys`) and delegates when the
#   unique set is a known pair in _SWITCHYARD_PAIRS (pair 1 required,
#   N>=2 discovered from *_MODEL_N) — duplicates do not break the pair
#   check, so no shim change is needed.
# - Upstream StageRoutingPlugin does the same dedupe and requires exactly two
#   UNIQUE candidates ordered capable-first, efficient-second. It then narrows
#   to the winning tier string (e.g. ["<cheap>", "<cheap>"]), and LiteLLM's
#   `_filter_by_routing_plugin_candidates` keeps every healthy deployment whose
#   model is in that set — i.e. both cheap endpoints — before its normal
#   load-balancing/failover picks one. Switchyard picks the TIER, LiteLLM picks
#   the ENDPOINT within the tier.
#
# Rules (see README "Multiple endpoints for the same model"):
#
# - Every endpoint serving the same model MUST share the identical model string
#   and differ ONLY via api_base. A `-host-b` suffix or another prefix looks
#   like a third tier and breaks the pair (shim warns, upstream raises).
# - Keep declaration order: capable (expensive) FIRST, efficient (cheap) after.
# NOTE: LiteLLM only interpolates values that start with `os.environ/`
model_list:
  # Switchyard Stage-routed models
  # Base file expects only 2 models per routed group name; this example adds
  # a second cheap endpoint (3 deployments, 2 UNIQUE models under
  # `os.environ/SWITCHYARD_GROUP`). Switchyard dedupes by model string, so
  # capable-FIRST order is still the contract.
  # Switchyard expects the capable (expensive) model FIRST, and the efficient
  # (cheap) model SECOND.
  # Do not reorder in the Admin UI.
  - model_name: os.environ/SWITCHYARD_GROUP
    litellm_params:
      # EXPENSIVE_MODEL is derived from EXPENSIVE_MODEL_ID with an `openai/`
      # prefix added in compose.yaml to indicate an OpenAI compatible endpoint.
      model: os.environ/EXPENSIVE_MODEL
      api_base: os.environ/EXPENSIVE_API_BASE
      api_key: os.environ/EXPENSIVE_API_KEY
      timeout: os.environ/EXPENSIVE_MODEL_TIMEOUT
      max_retries: os.environ/EXPENSIVE_MODEL_RETRIES
      # Attached to the body of the request to specify the reasoning effort
      # when the expensive model is used.
      extra_body:
        reasoning_effort: os.environ/EXPENSIVE_REASONING_EFFORT
    model_info:
      # No cost fields on purpose: backends here bill their own credits, not
      # public API rates — fabricated costs would corrupt spend logs.
      # Served context window, env-owned (sane default in compose.yaml).
      max_input_tokens: os.environ/EXPENSIVE_MAX_INPUT_TOKENS
      max_output_tokens: os.environ/EXPENSIVE_MAX_OUTPUT_TOKENS
      supports_reasoning: true
      supports_function_calling: true
      supports_vision: false
  - model_name: os.environ/SWITCHYARD_GROUP
    litellm_params:
      # CHEAP_MODEL is derived from CHEAP_MODEL_ID with an `openai/` prefix
      # added in compose.yaml to indicate an OpenAI compatible endpoint.
      model: os.environ/CHEAP_MODEL
      api_base: os.environ/CHEAP_API_BASE
      api_key: os.environ/CHEAP_API_KEY
      timeout: os.environ/CHEAP_MODEL_TIMEOUT
      max_retries: os.environ/CHEAP_MODEL_RETRIES
      # Attached to the body of the request to specify the reasoning effort
      # when the cheap model is used.
      extra_body:
        reasoning_effort: os.environ/CHEAP_REASONING_EFFORT
    model_info:
      max_input_tokens: os.environ/CHEAP_MAX_INPUT_TOKENS
      max_output_tokens: os.environ/CHEAP_MAX_OUTPUT_TOKENS
      supports_reasoning: true
      supports_function_calling: true
      supports_vision: false
  # Cheap endpoint B (local server 2, 172.17.12.4:8080). Same tier: identical
  # `model` string, every other CHEAP_* variable reused — only api_base is
  # hardcoded instead of using the .env URL (endpoint A above keeps
  # os.environ/CHEAP_API_BASE).
  - model_name: os.environ/SWITCHYARD_GROUP
    litellm_params:
      model: os.environ/CHEAP_MODEL
      api_base: http://172.17.12.4:8080/v1
      api_key: os.environ/CHEAP_API_KEY
      timeout: os.environ/CHEAP_MODEL_TIMEOUT
      max_retries: os.environ/CHEAP_MODEL_RETRIES
      extra_body:
        reasoning_effort: os.environ/CHEAP_REASONING_EFFORT
    model_info:
      max_input_tokens: os.environ/CHEAP_MAX_INPUT_TOKENS
      max_output_tokens: os.environ/CHEAP_MAX_OUTPUT_TOKENS
      supports_reasoning: true
      supports_function_calling: true
      supports_vision: false
  - model_name: os.environ/CHEAP_MODEL
    litellm_params:
      model: os.environ/CHEAP_MODEL
      api_base: os.environ/CHEAP_API_BASE
      api_key: os.environ/CHEAP_API_KEY
      extra_body:
        reasoning_effort: os.environ/CHEAP_REASONING_EFFORT
      timeout: os.environ/CHEAP_MODEL_TIMEOUT
      max_retries: os.environ/CHEAP_MODEL_RETRIES
    model_info:
      max_input_tokens: os.environ/CHEAP_MAX_INPUT_TOKENS
      max_output_tokens: os.environ/CHEAP_MAX_OUTPUT_TOKENS
      supports_reasoning: true
      supports_function_calling: true
      supports_vision: false
  - model_name: os.environ/EXPENSIVE_MODEL
    litellm_params:
      model: os.environ/EXPENSIVE_MODEL
      api_base: os.environ/EXPENSIVE_API_BASE
      api_key: os.environ/EXPENSIVE_API_KEY
      extra_body:
        reasoning_effort: os.environ/EXPENSIVE_REASONING_EFFORT
      timeout: os.environ/EXPENSIVE_MODEL_TIMEOUT
      max_retries: os.environ/EXPENSIVE_MODEL_RETRIES
    model_info:
      max_input_tokens: os.environ/EXPENSIVE_MAX_INPUT_TOKENS
      max_output_tokens: os.environ/EXPENSIVE_MAX_OUTPUT_TOKENS
      supports_reasoning: true
      supports_function_calling: true
      supports_vision: false
  # Pair 1 ends here (3 routed + 2 direct = 5 deployments: the extra routed
  # cheap endpoint above is the only diff vs litellm.yaml). For a second
  # pair, see litellm.multipair.yaml + .env.multipair.

router_settings:
  # Scoped shim (plugins/stage_scoped.py): delegates to Switchyard stage
  # routing only for the configured pair(s); every other model group
  # (including GUI/DB-added models) passes through untouched.
  plugins:
    - stage_scoped.PLUGIN

# Headroom compression (https://docs.litellm.ai/docs/proxy/headroom):
# LiteLLM calls POST {api_base}/v1/compress with {messages, model} in the
# pre_call step, then forwards the compressed payload to the backend itself.
# Routing already happened by then, so Switchyard scores pristine client
# messages; compression is in-flight only and never rewrites the client's
# stored history (next-turn routing still sees originals).
guardrails:
  - guardrail_name: headroom-compression
    litellm_params:
      guardrail: headroom
      mode: pre_call
      api_base: os.environ/HEADROOM_API_BASE
      # HEADROOM_DEFAULT_ON
      # - false keeps it opt-in via per-request `guardrails` / per-key
      # - true compresses every request on both model tiers
      default_on: os.environ/HEADROOM_DEFAULT_ON

litellm_settings:
  # Upstream object keeps the callback role: applies Switchyard's
  # request_patch after deployment selection. Do not remove.
  callbacks:
    - switchyard_litellm.configuration.configured_plugin.ROUTING_PLUGIN

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  store_prompts_in_spend_logs: true
  # Forward client x-* headers (e.g. x-session-id, required by some backends)
  # to providers on every group. Global (not per-group) because group names
  # are env-valued here and LiteLLM does not interpolate os.environ/ inside
  # string lists — a per-group list would silently never match. The x-*
  # allowlist still applies; Authorization/Content-Type are never forwarded.
  forward_client_headers_to_llm_api: true
