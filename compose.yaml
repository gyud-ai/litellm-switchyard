services:
  gateway:
    build: .
    # Local builds avoid requiring an unpublished release image on this branch.
    image: ${GATEWAY_IMAGE:-switchyard-gateway:local}
    restart: unless-stopped
    env_file: .env
    environment:
      HEADROOM_BEACON: "off"
      HEADROOM_TELEMETRY: "off"
      DO_NOT_TRACK: "1"
    ports:
      - "${GATEWAY_IP:-127.0.0.1}:${GATEWAY_PORT:-4000}:4000"
    volumes:
      - ./config.jsonc:/app/config.jsonc:ro
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
